<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — منصة المذاكرة</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="top-navbar">
  <div class="brand">CLEAR<span>NOTE</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="showToast('قريباً')"><i class="far fa-bell"></i></button>
  <div class="top-avatar" id="topAvatar" onclick="switchView('profile')">U</div>
</nav>

<aside class="side-nav">
  <button class="nav-item active" onclick="switchView('home')"><i class="fas fa-home"></i><span>الرئيسية</span></button>
  <button class="nav-item" onclick="switchView('content')"><i class="fas fa-book-open"></i><span>المحتوى</span></button>
  <button class="nav-item" onclick="switchView('profile')"><i class="fas fa-user"></i><span>حسابي</span></button>
</aside>

<main class="app-main" id="appMain">
  <section class="view active" id="homeView">
    <div class="content-wrap">
      <div class="greeting-card">
        <div class="greet-small" id="greetSmall">صباح الخير ☀️</div>
        <h1 class="greet-name">أهلاً، <span id="greetName">...</span></h1>
        <button class="greet-cta" onclick="switchView('content')"><i class="fas fa-play"></i> ابدأ المذاكرة</button>
      </div>
      <div class="section">
        <h2 class="section-title"><i class="fas fa-bolt"></i> إجراءات سريعة</h2>
        <div class="quick-grid">
          <div class="quick-card" onclick="switchView('content')"><div class="quick-icon" style="background:linear-gradient(135deg,#2980b9,#5dade2)"><i class="fas fa-book-open"></i></div><div class="quick-label">تصفح المحتوى</div></div>
        </div>
      </div>
      <div class="section">
        <h2 class="section-title"><i class="fas fa-lightbulb"></i> مقترح ليك</h2>
        <div class="content-grid" id="suggestedGrid"></div>
      </div>
    </div>
  </section>

  <section class="view" id="contentView">
    <div class="content-wrap">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="content-grid" id="cardsContainer"></div>
    </div>
  </section>

  <section class="view" id="profileView">
    <div class="content-wrap">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <h2 class="profile-name" id="profileName">...</h2>
        <div class="profile-email" id="profileEmail">...</div>
      </div>
      <div class="profile-list">
        <div class="profile-item danger" onclick="doLogout()"><div class="pi-icon"><i class="fas fa-sign-out-alt"></i></div><div class="pi-text">تسجيل الخروج</div><i class="fas fa-chevron-left pi-arrow"></i></div>
      </div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchView('home')"><i class="fas fa-home"></i><span>الرئيسية</span></button>
  <button class="nav-item" onclick="switchView('content')"><i class="fas fa-book-open"></i><span>المحتوى</span></button>
  <button class="nav-item" onclick="switchView('profile')"><i class="fas fa-user"></i><span>حسابي</span></button>
</nav>

<div id="lessonPlayer">
  <div class="player-header">
    <h2 class="player-title" id="playerTitle">المحتوى</h2>
    <button class="player-close" onclick="closePlayer()"><i class="fas fa-times"></i> خروج</button>
  </div>
  <iframe id="playerFrame" class="player-frame" sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-modals"></iframe>
</div>

<script type="module">
import { db, onAuth, goTo, showToast, signOutUser } from "./shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let userDataGlobal = null;
let treeData = [];

onAuth((user, userData) => {
  if (!user) { goTo("index.html"); return; }
  userDataGlobal = userData;
  const displayName = userData?.name || user.email.split('@')[0];
  document.getElementById("topAvatar").textContent = displayName.charAt(0).toUpperCase();
  document.getElementById("profileAvatar").textContent = displayName.charAt(0).toUpperCase();
  document.getElementById("greetName").textContent = displayName;
  document.getElementById("profileName").textContent = displayName;
  document.getElementById("profileEmail").textContent = user.email;
  loadData();
});

window.doLogout = async () => {
  if (confirm('تسجيل الخروج؟')) { await signOutUser(); goTo("index.html"); }
};

window.switchView = function(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view + 'View').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (view === 'content') renderLevel('root');
};

async function loadData() {
  try {
    const snap = await getDocs(collection(db, "content_tree"));
    treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.log(e); }
}

function renderLevel(parentId) {
  const container = document.getElementById('cardsContainer');
  container.innerHTML = '';
  updateBreadcrumbs(parentId);
  const nodes = treeData.filter(n => n.parentId === parentId);
  
  if (nodes.length === 0) {
    container.innerHTML = `<div class="empty-state"><p>لا يوجد محتوى</p></div>`;
    return;
  }
  
  container.innerHTML = nodes.map(node => {
    return `
      <div class="card-item" onclick="handleClick('${node.id}')">
        <div class="card-type">تصنيف</div>
        <h3 class="card-title">${node.title}</h3>
      </div>
    `;
  }).join('');
}

window.handleClick = function(id) {
  const node = treeData.find(n => n.id === id);
  if(!node) return;
  if (node.type && node.type.startsWith('module_')) {
    openPlayer(node);
  } else {
    renderLevel(node.id);
  }
};

function updateBreadcrumbs(parentId) {
  const bc = document.getElementById('breadcrumbs');
  bc.innerHTML = `<span class="crumb" onclick="renderLevel('root')"><i class="fas fa-home"></i> الرئيسية</span>`;
  if (parentId === 'root') return;
  
  let path = [];
  let current = treeData.find(n => n.id === parentId);
  while (current) { path.unshift(current); current = treeData.find(n => n.id === current.parentId); }
  
  path.forEach(p => {
    bc.innerHTML += ` <i class="fas fa-chevron-left"></i> <span class="crumb" onclick="renderLevel('${p.id}')">${p.title}</span>`;
  });
}

function openPlayer(node) {
  document.getElementById('playerTitle').textContent = node.title;
  document.getElementById('lessonPlayer').classList.add('active');
  const iframe = document.getElementById('playerFrame');
  iframe.srcdoc = `<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:16px}</style></head><body>${node.htmlContent || '<h2>لا يوجد محتوى</h2>'}</body></html>`;
}

window.closePlayer = function() {
  document.getElementById('lessonPlayer').classList.remove('active');
  document.getElementById('playerFrame').srcdoc = '';
};
</script>
</body>
</html>
