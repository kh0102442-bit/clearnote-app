<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — منصة المذاكرة</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="brand">
      <div class="brand-name">CLEAR<span>NOTE</span></div>
      <div class="brand-sub">STUDY PLATFORM</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">دخول</button>
      <button class="auth-tab" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>

    <div id="loginForm" class="auth-form active">
      <label>البريد الإلكتروني</label>
      <input type="email" id="loginEmail" placeholder="أدخل بريدك" dir="ltr" style="text-align: right;">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
    </div>

    <div id="signupForm" class="auth-form">
      <label>الاسم</label>
      <input type="text" id="su_name" placeholder="اسمك الكامل">
      <label>البريد الإلكتروني</label>
      <input type="email" id="su_email" placeholder="student@university.edu" dir="ltr" style="text-align: right;">
      <label>كلمة المرور</label>
      <input type="password" id="su_password" placeholder="6 أحرف على الأقل">
      <button class="btn-primary" id="signupBtn" onclick="doSignup()">إنشاء الحساب</button>
    </div>

    <div class="auth-foot">ClearNote · v1.0</div>
  </div>
</div>

<div id="welcomeScreen" class="welcome-screen" style="display:none">
  <div class="welcome-box">
    <div class="brand" style="margin-bottom:20px">
      <div class="brand-name" style="color:#fff">CLEAR<span style="color:#c9a44a">NOTE</span></div>
    </div>
    <h2>أهلاً بك، <span id="welcomeName">—</span></h2>
    <p class="welcome-sub">تم تسجيل الدخول بنجاح.</p>
    
    <button class="btn-primary" id="studentBtn" style="background:#152741; margin-bottom:12px;" onclick="window.location.href='app.html'">الدخول إلى المنصة</button>
    <button class="btn-primary" id="adminBtn" style="display:none; background:#1f6b45; margin-bottom:12px;" onclick="window.location.href='admin.html'">لوحة التحكم</button>
    <button class="btn-primary" onclick="doLogout()">تسجيل الخروج</button>
  </div>
</div>

<script type="module">
import { auth, signIn, signUp, signOutUser, onAuth, isAdmin, goTo } from "./shared.js";

window.switchTab = function (tab) {
  document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".auth-form").forEach(f => f.classList.remove("active"));
  document.getElementById(tab + "Form").classList.add("active");
  document.getElementById("statusMsg").textContent = "";
};

function setStatus(msg) {
  document.getElementById("statusMsg").textContent = msg;
}

window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  if (!email || !password) { setStatus("أدخل البيانات"); return; }
  btn.disabled = true; btn.textContent = "جاري الدخول…"; setStatus("");
  try {
    await signIn(email, password);
  } catch (err) {
    setStatus(err.message);
    btn.disabled = false; btn.textContent = "دخول";
  }
};

window.doSignup = async function () {
  const name = document.getElementById("su_name").value.trim();
  const email = document.getElementById("su_email").value.trim();
  const password = document.getElementById("su_password").value;
  const btn = document.getElementById("signupBtn");
  if (!name || !email || !password) { setStatus("أدخل كل الحقول"); return; }
  btn.disabled = true; btn.textContent = "جاري الإنشاء…"; setStatus("");
  try {
    await signUp(email, password, name);
    setStatus("✅ تم إنشاء الحساب!");
  } catch (err) {
    setStatus(err.message);
    btn.disabled = false; btn.textContent = "إنشاء الحساب";
  }
};

window.doLogout = async function () { await signOutUser(); };

onAuth((user, userData) => {
  if (!user) {
    document.getElementById("authScreen").style.display = "flex";
    document.getElementById("welcomeScreen").style.display = "none";
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").textContent = "دخول";
    return;
  }
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("welcomeScreen").style.display = "flex";
  document.getElementById("welcomeName").textContent = userData?.name || user.email;
  
  if (isAdmin(userData)) {
    document.getElementById("adminBtn").style.display = "block";
  }
});
</script>
</body>
</html>
