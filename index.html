<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — منصة المذاكرة</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="brand">
      <div class="brand-name">CLEAR<span>NOTE</span></div>
      <div class="brand-sub">STUDY PLATFORM</div>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="switchTab('login')">دخول</button>
      <button class="auth-tab" data-tab="signup" onclick="switchTab('signup')">إنشاء حساب</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>

    <!-- Login -->
    <div id="loginForm" class="auth-form active">
      <label>البريد الإلكتروني أو الهاتف أو الرقم القومي</label>
      <input type="text" id="loginEmail" placeholder="أدخل بيانات الدخول" dir="ltr" style="text-align: right;">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
    </div>

    <!-- Signup -->
    <div id="signupForm" class="auth-form">
      <div class="step-progress"><div class="step-progress-bar" id="stepProgress"></div></div>
      
      <div class="signup-step active" id="step1">
        <div class="step-title">البيانات الأساسية</div>
        <label>الاسم الرباعي</label>
        <input type="text" id="su_name" placeholder="محمد أحمد محمود">
        <label>الرقم القومي</label>
        <input type="text" id="su_national" placeholder="14 رقم" maxlength="14" dir="ltr" style="text-align: right;">
        <label>رقم الهاتف</label>
        <input type="tel" id="su_phone" placeholder="01xxxxxxxxx" dir="ltr" style="text-align: right;">
        <button class="btn-primary" onclick="nextStep(2)">التالي</button>
      </div>

      <div class="signup-step" id="step2">
        <div class="step-title">البيانات الأكاديمية</div>
        <label>البريد الجامعي</label>
        <input type="email" id="su_uniEmail" placeholder="student@university.edu" dir="ltr" style="text-align: right;">
        <label>الجامعة</label>
        <input type="text" id="su_university" placeholder="جامعة القاهرة">
        <label>الدور</label>
        <select id="su_role">
          <option value="student">طالب</option>
          <option value="ta">معيد</option>
          <option value="doctor">دكتور</option>
        </select>
        <button class="btn-primary" onclick="nextStep(3)">التالي</button>
        <button class="btn-cancel" style="width:100%; padding:14px; background:transparent; border:none; color:var(--muted); margin-top:10px; cursor:pointer; font-size:16px;" onclick="prevStep(1)">رجوع</button>
      </div>

      <div class="signup-step" id="step3">
        <div class="step-title">بيانات الحساب</div>
        <label>كلمة المرور</label>
        <input type="password" id="su_password" placeholder="6 أحرف على الأقل">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="su_confirmPassword" placeholder="أعد كتابة كلمة المرور">
        <button class="btn-primary" id="signupBtn" onclick="doSignup()">إنشاء الحساب</button>
        <button class="btn-cancel" style="width:100%; padding:14px; background:transparent; border:none; color:var(--muted); margin-top:10px; cursor:pointer; font-size:16px;" onclick="prevStep(2)">رجوع</button>
      </div>
    </div>

    <div class="auth-foot">ClearNote · v1.0</div>
  </div>
</div>

<div id="welcomeScreen" class="welcome-screen" style="display:none">
  <div class="welcome-box">
    <div class="brand" style="margin-bottom:20px">
      <div class="brand-name" style="color:#fff">CLEAR<span style="color:#c9a44a">NOTE</span></div>
    </div>
    <h2>أهلاً بك، <span id="welcomeName">—</span></h2>
    <p class="welcome-sub">تم تسجيل الدخول بنجاح.</p>
    <div class="welcome-info">
      <div class="info-row"><span>الدور:</span> <b id="welcomeRole">—</b></div>
      <div class="info-row"><span>البريد:</span> <b id="welcomeEmail">—</b></div>
    </div>
    
    <button class="btn-primary" id="studentBtn" style="display:none; background:#152741; margin-bottom:12px;" onclick="window.location.href='app.html'">الدخول إلى المنصة</button>
    <button class="btn-primary" id="adminBtn" style="display:none; background:#1f6b45; margin-bottom:12px;" onclick="window.location.href='admin.html'">لوحة التحكم (أدمن)</button>
    <button class="btn-primary" onclick="doLogout()">تسجيل الخروج</button>
  </div>
</div>

<script type="module">
import { auth, signIn, signUp, signOutUser, onAuth, isAdmin, goTo, showToast } from "./shared.js";

window.switchTab = function (tab) {
  document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".auth-form").forEach(f => f.classList.remove("active"));
  document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add("active");
  document.getElementById(tab + "Form").classList.add("active");
  document.getElementById("statusMsg").textContent = "";
};

window.nextStep = function (step) {
  document.querySelectorAll(".signup-step").forEach(s => s.classList.remove("active"));
  document.getElementById("step" + step).classList.add("active");
  document.getElementById("stepProgress").style.width = (step * 33) + "%";
};
window.prevStep = function (step) {
  document.querySelectorAll(".signup-step").forEach(s => s.classList.remove("active"));
  document.getElementById("step" + step).classList.add("active");
  document.getElementById("stepProgress").style.width = (step * 33) + "%";
};

function setStatus(msg, type = "err") {
  const el = document.getElementById("statusMsg");
  el.className = "status-msg " + (msg ? type : "");
  el.textContent = msg || "";
}

window.doLogin = async function () {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  if (!email || !password) { setStatus("أدخل بيانات الدخول"); return; }
  btn.disabled = true; btn.textContent = "جاري الدخول…"; setStatus("");
  try {
    await signIn(email, password);
  } catch (err) {
    setStatus(err.message);
    btn.disabled = false; btn.textContent = "دخول";
  }
};

window.doSignup = async function () {
  const name = document.getElementById("su_name").value.trim();
  const nationalId = document.getElementById("su_national").value.trim();
  const phone = document.getElementById("su_phone").value.trim();
  const uniEmail = document.getElementById("su_uniEmail").value.trim();
  const university = document.getElementById("su_university").value.trim();
  const role = document.getElementById("su_role").value;
  const password = document.getElementById("su_password").value;
  const confirm = document.getElementById("su_confirmPassword").value;
  const btn = document.getElementById("signupBtn");

  if (!name || !nationalId || !phone || !uniEmail || !university || !password) { setStatus("أدخل كل الحقول"); return; }
  if (password !== confirm) { setStatus("كلمتا المرور غير متطابقتين"); return; }
  if (password.length < 6) { setStatus("كلمة المرور 6 أحرف على الأقل"); return; }

  btn.disabled = true; btn.textContent = "جاري الإنشاء…"; setStatus("");

  try {
    await signUp(uniEmail, password, name, {
      nationalId, phone, uniEmail, university, role
    });
    setStatus("✅ تم إنشاء الحساب!", "ok");
  } catch (err) {
    setStatus(err.message);
    btn.disabled = false; btn.textContent = "إنشاء الحساب";
  }
};

window.doLogout = async function () { await signOutUser(); showToast("تم تسجيل الخروج"); };

onAuth((user, userData) => {
  const authScreen = document.getElementById("authScreen");
  const welcomeScreen = document.getElementById("welcomeScreen");
  if (!user) {
    authScreen.style.display = "flex";
    welcomeScreen.style.display = "none";
    return;
  }
  authScreen.style.display = "none";
  welcomeScreen.style.display = "flex";
  document.getElementById("welcomeName").textContent = userData?.name || user.email;
  document.getElementById("welcomeEmail").textContent = user.email;
  
  let roleText = "طالب";
  if (userData?.role === 'admin') roleText = "أدمن";
  else if (userData?.role === 'ta') roleText = "معيد";
  else if (userData?.role === 'doctor') roleText = "دكتور";
  
  document.getElementById("welcomeRole").textContent = roleText;
  
  document.getElementById("studentBtn").style.display = "block";
  if (isAdmin(userData)) {
    document.getElementById("adminBtn").style.display = "block";
  }
});
</script>
</body>
</html>
