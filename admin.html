<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — لوحة التحكم</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --navy: #152741; --accent: #a8741a; --bg: #f4f6f8; --white: #ffffff; --text: #1a1a1a; --muted: #5b6472; --line: #e9ecef; --green: #1f6b45; --red: #b91c1c; --blue: #2980b9; --purple: #8e44ad; }
  html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; background: var(--bg); font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 30px; font-size: 16px; }

  .admin-header { background: var(--navy); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
  .admin-brand { font-family: Georgia, serif; font-size: 20px; font-weight: bold; }
  .admin-brand span { color: var(--accent); }
  .btn-add-main { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-logout { background: rgba(255,255,255,0.1); color: white; border: none; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }

  .admin-nav { display: flex; gap: 6px; margin-bottom: 15px; padding: 0 15px; overflow-x: auto; }
  .nav-tab { flex: 1 0 auto; min-width: 110px; background: var(--white); border: 2px solid var(--line); padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: bold; color: var(--muted); cursor: pointer; text-align: center; transition: 0.2s; white-space: nowrap; }
  .nav-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
  .nav-tab .tab-count { display: inline-block; background: var(--red); color: white; border-radius: 9999px; padding: 0 6px; font-size: 10px; margin-right: 4px; min-width: 16px; line-height: 16px; }

  .admin-container { padding: 0 15px; width: 100%; box-sizing: border-box; }

  .tree-group { margin-bottom: 10px; }
  .node-card { background: var(--white); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); overflow: hidden; }
  .node-header { padding: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; cursor: pointer; }
  .node-title-area { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
  .node-icon { width: 32px; height: 32px; border-radius: 8px; background: #eef2fa; color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .node-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .node-title { font-weight: 700; color: var(--navy); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-type { font-size: 11px; color: var(--accent); font-weight: 600; margin-top: 2px; }

  .node-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .action-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #f8f9fa; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  .action-btn.manage { color: var(--green); border-color: #c9d6ee; background: #eef2fa; }
  .action-btn.danger { color: var(--red); background: #fbeaea; border-color: #fbeaea; }

  .children-area { display: none; padding: 10px; background: #fafbfc; border-top: 2px solid var(--line); }
  .children-area.active { display: block; }

  .student-card, .request-card { background: var(--white); border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .student-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 140px; }
  .student-name { font-weight: bold; color: var(--navy); font-size: 15px; }
  .student-email { font-size: 12px; color: var(--muted); }
  .student-role { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; margin-top: 3px; width: max-content; font-family: 'Inter', 'Cairo', sans-serif; }
  .role-student { background: #eef2fa; color: #2a4b8d; }
  .role-ta { background: #e3f2fd; color: #0d47a1; }
  .role-doctor { background: #f3e5f5; color: #4a148c; }
  .role-admin { background: #fbeaea; color: #7b1818; }
  .verified-inline { color: #1da1f2; margin-right: 4px; font-size: 14px; }

  .request-title { font-weight: 800; color: var(--navy); font-size: 15px; margin-bottom: 4px; }
  .request-sub { font-size: 13px; color: var(--accent); margin-bottom: 4px; }
  .request-notes { font-size: 12px; color: var(--muted); margin-bottom: 10px; background: #fafbfc; padding: 6px 8px; border-radius: 6px; line-height: 1.55; }
  .request-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--white); border-radius: 20px 20px 0 0; width: 100%; max-width: 520px; margin: 0 auto; padding: 20px 15px; max-height: 92vh; overflow-y: auto; box-sizing: border-box; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-box h3 { margin: 0 0 12px; color: var(--navy); font-size: 18px; text-align: center; }
  .form-group { margin-bottom: 15px; width: 100%; }
  .form-group label { display: block; font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 15px; box-sizing: border-box; background: #fafbfc; }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  .btn-save { flex: 1; background: var(--navy); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .btn-save:disabled { opacity: 0.6; cursor: wait; }
  .btn-cancel { flex: 1; background: #e9ecef; color: var(--muted); border: none; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .module-item { background: #f8f9fa; border: 2px solid var(--line); border-radius: 10px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
  .module-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
  .module-title { font-size: 14px; font-weight: 800; color: var(--navy); }
  .icon-explain { background: #27ae60; } .icon-video { background: #e74c3c; } .icon-questions { background: #3498db; } .icon-summary { background: #9b59b6; } .icon-terms { background: #e67e22; }

  .video-item { background: #fafbfc; border: 2px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .video-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .video-file-preview { margin-top: 8px; padding: 8px 10px; background: #fff; border-radius: 6px; font-size: 13px; color: #333; }

  .html-upload-zone { border: 2px dashed #c9d6ee; background: #f8fbff; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; transition: 0.2s; }
  .html-upload-zone:hover, .html-upload-zone.drag-over { border-color: var(--navy); background: #eef2fa; }
  .html-upload-zone i { font-size: 28px; color: var(--navy); margin-bottom: 8px; display: block; }
  .html-upload-zone .up-text { font-size: 13px; color: var(--navy); font-weight: 700; }
  .html-upload-zone .up-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .html-upload-zone.success { border-color: var(--green); background: #e8f5e9; }
  .html-upload-zone.success i { color: var(--green); }
  .html-file-info { font-size: 12px; color: var(--green); margin-top: 6px; display: none; font-weight: 700; }
  .html-file-info.show { display: block; }
  .divider-text { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0; position: relative; font-weight: 700; }
  .divider-text:before, .divider-text:after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--line); }
  .divider-text:before { left: 0; } .divider-text:after { right: 0; }

  /* Admin Notifications */
  .admin-notif-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 420px; background: var(--white); z-index: 99999; transform: translateX(100%); transition: transform 0.3s ease; display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,.15); }
  .admin-notif-panel.active { transform: translateX(0); }
  .admin-notif-panel-header { background: var(--navy); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .admin-notif-panel-header h3 { margin: 0; font-size: 16px; }
  .admin-notif-panel-header button { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .admin-notif-panel-body { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }
  .admin-notif-panel-footer { padding: 12px; border-top: 1px solid var(--line); text-align: center; }
  .admin-notif-panel-footer button { background: transparent; border: none; color: var(--accent); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .admin-notif-item { background: var(--white); border-radius: 10px; padding: 12px; margin-bottom: 8px; border-right: 3px solid var(--line); cursor: pointer; transition: 0.15s; }
  .admin-notif-item.unread { border-right-color: var(--accent); background: #fefaf0; }
  .admin-notif-item:hover { background: var(--line-soft); }
  .admin-notif-item .n-title { font-weight: 800; font-size: 14px; color: var(--navy); margin-bottom: 4px; }
  .admin-notif-item .n-msg { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 6px; }
  .admin-notif-item .n-time { font-size: 11px; color: var(--text-light); }
  .admin-notif-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 99998; display: none; }
  .admin-notif-overlay.active { display: block; }

  /* Verification cards */
  .verif-card { background: var(--white); border: 2px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .verif-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .verif-name { font-weight: 800; color: var(--navy); font-size: 15px; }
  .verif-role { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 20px; font-family: 'Inter', 'Cairo', sans-serif; }
  .verif-type-badge { font-size: 11.5px; font-weight: 800; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .verif-free { background: #e8f5e9; color: #1f6b45; }
  .verif-paid { background: #e7f5ff; color: #0d47a1; }
  .verif-details { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
  .verif-details strong { color: var(--navy); }
  .verif-actions { display: flex; gap: 8px; }
  .verif-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .verif-btn.approve { background: var(--green); color: white; }
  .verif-btn.reject { background: #fbeaea; color: var(--red); border: 1px solid #f0c6c6; }
  .verif-status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
  .vs-pending { background: #fef3c7; color: #92400e; }
  .vs-approved { background: #e8f5e9; color: var(--green); }
  .vs-rejected { background: #fbeaea; color: var(--red); }

  .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
  .filter-btn { padding: 8px 14px; border-radius: 20px; border: 2px solid var(--line); background: var(--white); color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }
</style>
</head>
<body>

<div class="admin-header">
  <div class="admin-brand">CLEAR<span>NOTE</span></div>
  <div style="display:flex; gap:8px;">
    <button class="btn-add-main" id="addBtn" onclick="openAddModal(null, 'root')"><i class="fas fa-plus"></i> سنة</button>
    <button class="btn-logout" onclick="openAdminNotifications()" style="position:relative; color: var(--accent);">
      <i class="fas fa-bell"></i>
      <span id="adminNotifBadge" style="display:none; position:absolute; top:2px; right:2px; background:var(--red); color:white; border-radius:50%; min-width:16px; height:16px; font-size:10px; align-items:center; justify-content:center; padding:0 3px; font-weight:bold;">0</span>
    </button>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
  </div>
</div>

<div class="admin-nav">
  <div class="nav-tab active" data-tab="tree" onclick="switchTab('tree')">المحتوى</div>
  <div class="nav-tab" data-tab="students" onclick="switchTab('students')">المستخدمون</div>
  <div class="nav-tab" data-tab="requests" onclick="switchTab('requests')">طلبات الاشتراك <span class="tab-count" id="reqCount" style="display:none;">0</span></div>
  <div class="nav-tab" data-tab="verification" onclick="switchTab('verification')">التوثيق <span class="tab-count" id="verifCount" style="display:none;">0</span></div>
</div>

<div class="admin-container">
  <div id="treeContainer"></div>
  <div id="studentsContainer" style="display:none;"></div>
  <div id="requestsContainer" style="display:none;"></div>
  <div id="verificationContainer" style="display:none;"></div>
</div>

<!-- Modals (existing) -->
<div class="modal-overlay" id="deviceModal"><div class="modal-box"><h3>الأجهزة</h3><div id="deviceList" style="margin-top:15px;"></div><button class="btn-cancel" style="width:100%; margin-top:15px;" onclick="closeModal('deviceModal')">إغلاق</button></div></div>
<div class="modal-overlay" id="nodeModal"><div class="modal-box"><h3 id="modalTitle">إضافة</h3><p id="modalDesc"></p><input type="hidden" id="nodeParentId"><input type="hidden" id="nodeType"><div class="form-group" id="titleGroup"><label>العنوان</label><input type="text" id="nodeTitle"></div><div class="modal-actions"><button class="btn-cancel" onclick="closeModal('nodeModal')">إلغاء</button><button class="btn-save" onclick="saveNode()">حفظ</button></div></div></div>
<div class="modal-overlay" id="manageModal"><div class="modal-box"><h3 id="manageTitle">إدارة محتوى</h3><p>اختر الجزء:</p><div class="modules-grid"><div class="module-item" onclick="openCodeEditor('explain', 'الشرح')"><div class="module-icon icon-explain"><i class="fas fa-file-alt"></i></div><div class="module-title">الشرح</div></div><div class="module-item" onclick="openVideoManager()"><div class="module-icon icon-video"><i class="fas fa-video"></i></div><div class="module-title">فيديو</div></div><div class="module-item" onclick="openCodeEditor('questions', 'أسئلة')"><div class="module-icon icon-questions"><i class="fas fa-question-circle"></i></div><div class="module-title">أسئلة</div></div><div class="module-item" onclick="openCodeEditor('summary', 'ملخص')"><div class="module-icon icon-summary"><i class="fas fa-clipboard-list"></i></div><div class="module-title">ملخص</div></div><div class="module-item" onclick="openCodeEditor('terms', 'مصطلحات')"><div class="module-icon icon-terms"><i class="fas fa-book"></i></div><div class="module-title">مصطلحات</div></div></div><button class="btn-cancel" style="width:100%;" onclick="closeModal('manageModal')">إغلاق</button></div></div>

<div class="modal-overlay" id="codeModal">
  <div class="modal-box">
    <h3 id="codeTitle">إضافة كود</h3>
    <input type="hidden" id="currentNodeId">
    <input type="hidden" id="currentModuleKey">
    <div class="form-group"><label>عنوان المحتوى</label><input type="text" id="moduleTitleInput" placeholder="مثال: شرح المحاضرة الأولى"></div>
    <div class="form-group"><label>صلاحية الوصول</label><select id="moduleAccessInput"><option value="public">عام (مجاني للجميع)</option><option value="paid">مدفوع (للمشتركين فقط)</option></select></div>
    <div class="form-group">
      <label>الطريقة الأولى: ارفع ملف HTML من جهازك</label>
      <div class="html-upload-zone" id="htmlUploadZone" onclick="document.getElementById('htmlFileInput').click()">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="up-text">اضغط لاختيار ملف HTML</div>
        <div class="up-sub">.html أو .htm — سيتم قراءة المحتوى تلقائياً</div>
      </div>
      <input type="file" id="htmlFileInput" accept=".html,.htm,text/html" style="display:none" onchange="handleHtmlFileUpload(event)">
      <div class="html-file-info" id="htmlFileInfo"></div>
    </div>
    <div class="divider-text">أو</div>
    <div class="form-group"><label>الطريقة الثانية: الصق الكود مباشرة</label><textarea id="moduleCode" rows="8" style="font-family: monospace; font-size: 13px;" placeholder="<html>&#10;  <body>&#10;    <h1>محتوى المحاضرة</h1>&#10;  </body>&#10;</html>"></textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('codeModal')">إلغاء</button><button class="btn-save" onclick="saveModuleCode()">حفظ</button></div>
  </div>
</div>

<div class="modal-overlay" id="videoModal">
  <div class="modal-box" style="max-height:95vh;">
    <h3 id="videoModalTitle">إدارة الفيديوهات</h3>
    <div class="form-group"><label>عنوان قسم الفيديوهات</label><input type="text" id="videoSectionTitle" placeholder="مثال: فيديوهات المحاضرة الأولى"></div>
    <div class="form-group"><label>صلاحية الوصول</label><select id="videoAccessInput"><option value="public">عام (مجاني للجميع)</option><option value="paid">مدفوع (للمشتركين فقط)</option></select></div>
    <div id="videoItemsContainer"></div>
    <button class="btn-save" style="width:100%; background:var(--green); margin-bottom:12px;" onclick="addVideoItem()"><i class="fas fa-plus"></i> إضافة فيديو جديد</button>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('videoModal')">إلغاء</button><button class="btn-save" onclick="saveVideos()">حفظ الفيديوهات</button></div>
  </div>
</div>

<!-- Admin Notifications Panel -->
<div class="admin-notif-overlay" id="adminNotifOverlay" onclick="closeAdminNotifications()"></div>
<div class="admin-notif-panel" id="adminNotifPanel">
  <div class="admin-notif-panel-header">
    <h3><i class="fas fa-bell"></i> إشعارات الأدمن</h3>
    <button onclick="closeAdminNotifications()"><i class="fas fa-times"></i></button>
  </div>
  <div class="admin-notif-panel-body" id="adminNotifBody">
    <p style="text-align:center; color:var(--muted); padding:40px;">لا توجد إشعارات</p>
  </div>
  <div class="admin-notif-panel-footer">
    <button onclick="markAllAdminRead()">تعليم الكل كمقروء</button>
  </div>
</div>

<script type="module">
import {
  db, onAuth, isAdmin, goTo, showToast, signOutUser, activateSubscription,
  listenAdminNotifications, markAdminNotificationRead, markAllAdminNotificationsRead,
  createNotification, activateVerification, rejectVerification,
  escapeHtml
} from "./shared.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ===== State ===== */
let treeData = [];
let allStudents = [];
let allRequests = [];
let allVerifications = [];
let openNodes = new Set();
let videoItemCounter = 0;
let adminNotifs = [];
let adminNotifUnsub = null;
let verificationFilter = 'pending';

/* ===== Init ===== */
onAuth((user, userData) => {
  if (!user || !isAdmin(userData)) { goTo("index.html"); return; }
  loadAllData();
  adminNotifUnsub = listenAdminNotifications((notifs) => {
    adminNotifs = notifs;
    updateAdminBadge();
    renderAdminNotifsPanel();
  });
});

window.doLogout = async () => {
  if (adminNotifUnsub) adminNotifUnsub();
  await signOutUser();
  goTo("index.html");
};

/* ===== Tabs ===== */
window.switchTab = function(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['tree', 'students', 'requests', 'verification'].forEach(name => {
    const el = document.getElementById(name + 'Container');
    if (el) el.style.display = name === tab ? 'block' : 'none';
  });
  document.getElementById('addBtn').style.display = tab === 'tree' ? 'flex' : 'none';
};

/* ===== Load data ===== */
function saveOpenState() {
  document.querySelectorAll('.children-area').forEach(el => {
    if (el.classList.contains('active')) openNodes.add(el.id.replace('children-', ''));
    else openNodes.delete(el.id.replace('children-', ''));
  });
}

async function loadAllData() {
  saveOpenState();
  try {
    const [snapT, snapS, snapR, snapV] = await Promise.all([
      getDocs(collection(db, "content_tree")),
      getDocs(collection(db, "users")),
      getDocs(collection(db, "subscription_requests")),
      getDocs(query(collection(db, "verification_requests"), orderBy("createdAt", "desc")))
    ]);
    treeData = snapT.docs.map(d => ({ id: d.id, ...d.data() }));
    allStudents = snapS.docs.map(d => ({ id: d.id, ...d.data() }));
    allRequests = snapR.docs.map(d => ({ id: d.id, ...d.data() }));
    allVerifications = snapV.docs.map(d => ({ id: d.id, ...d.data() }));

    renderTree();
    renderStudents();
    renderRequests();
    renderVerification();
    updateTabCounts();
  } catch (e) {
    console.error(e);
    showToast('حدث خطأ في التحميل', 'error');
  }
}

function updateTabCounts() {
  const reqCount = allRequests.filter(r => r.status === 'pending').length;
  const reqBadge = document.getElementById('reqCount');
  if (reqBadge) {
    reqBadge.style.display = reqCount > 0 ? 'inline-block' : 'none';
    reqBadge.textContent = reqCount > 9 ? '9+' : reqCount;
  }
  const verifCount = allVerifications.filter(v => v.status === 'pending').length;
  const verifBadge = document.getElementById('verifCount');
  if (verifBadge) {
    verifBadge.style.display = verifCount > 0 ? 'inline-block' : 'none';
    verifBadge.textContent = verifCount > 9 ? '9+' : verifCount;
  }
}

/* ===== Subscription requests (existing) ===== */
function renderRequests() {
  const container = document.getElementById('requestsContainer');
  const pending = allRequests.filter(r => r.status === 'pending');
  if (pending.length === 0) {

window.approveSub = async function(reqId, uid, subId) {

};

window.rejectSub = async function(reqId) {
  try {
    const req = allRequests.find(r => r.id === reqId);
    await updateDoc(doc(db, 'subscription_requests', reqId), { status: 'rejected', reviewedAt: serverTimestamp() });
    if (req) {
      await createNotification(
        req.uid, 'subscription_rejected', '❌ تم رفض طلب الاشتراك',

      );

};

/* ===== Users list ===== */
function renderStudents() {
  const container = document.getElementById('studentsContainer');
  if (allStudents.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding:30px; color:var(--muted)">لا يوجد مستخدمون.</p>`;
    return;
  }
  container.innerHTML = allStudents.map(student => {

    <div class="student-card">
      <div class="student-info">

        <div class="student-email">${escapeHtml(student.email || '')}</div>
        <span class="student-role ${roleClass}">${roleLabel}</span>
      </div>

}

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">

window.updateDevice = async function(uid, devId, status) {

window.deleteDevice = async function(uid, devId) {
  if (!confirm('حذف هذا الجهاز؟')) return;
  await deleteDoc(doc(db, 'devices', uid, 'list', devId));
  showToast('تم الحذف');

};

/* ===== Verification ===== */
function renderVerification() {
  const container = document.getElementById('verificationContainer');
  const filters = ['pending', 'approved', 'rejected', 'all'];
  const filtersHtml = filters.map(f => {
    const labels = { pending: 'قيد المراجعة', approved: 'مقبولة', rejected: 'مرفوضة', all: 'الكل' };
    return `<button class="filter-btn ${verificationFilter === f ? 'active' : ''}" onclick="setVerifFilter('${f}')">${labels[f]}</button>`;
  }).join('');

  let list = allVerifications;
  if (verificationFilter !== 'all') list = list.filter(v => v.status === verificationFilter);

  let listHtml = '';
  if (list.length === 0) {
    listHtml = `<p style="text-align:center; padding:30px; color:var(--muted)">لا يوجد طلبات في هذه الفئة.</p>`;
  } else {
    listHtml = list.map(v => {
      const roleLabel = v.role === 'ta' ? 'TA' : v.role === 'doctor' ? 'Doctor' : 'Student';
      const roleClass = v.role === 'ta' ? 'role-ta' : v.role === 'doctor' ? 'role-doctor' : 'role-student';
      const typeLabel = v.type === 'free' ? 'توثيق مجاني' : 'توثيق مدفوع';
      const typeClass = v.type === 'free' ? 'verif-free' : 'verif-paid';
      const created = v.createdAt?.toDate ? v.createdAt.toDate().toLocaleString('ar-EG') : '—';
      const statusBadge = v.status === 'pending' ? '<span class="verif-status-badge vs-pending">قيد المراجعة</span>' :
                          v.status === 'approved' ? '<span class="verif-status-badge vs-approved">مقبول</span>' :
                          '<span class="verif-status-badge vs-rejected">مرفوض</span>';

      const planInfo = v.type === 'paid'
        ? `الخطة: <strong>${escapeHtml(v.plan || '')}</strong> — السعر: <strong>${v.price || 0}ج</strong> — المدة: <strong>${v.durationDays || 0}</strong> يوم`
        : `مجاني — بدون تاريخ انتهاء`;

      const notesHtml = v.notes ? `<div style="margin-top:6px; padding:8px; background:#fafbfc; border-radius:6px; font-size:12px; color:var(--muted);"><strong>ملاحظات:</strong> ${escapeHtml(v.notes)}</div>` : '';

      const actions = v.status === 'pending' ? `
        <div class="verif-actions">
          <button class="verif-btn approve" onclick="approveVerification('${v.id}', '${v.uid}')"><i class="fas fa-check"></i> موافقة</button>
          <button class="verif-btn reject" onclick="rejectVerificationPrompt('${v.id}', '${v.uid}')"><i class="fas fa-times"></i> رفض</button>
        </div>` : '';

      return `
        <div class="verif-card">
          <div class="verif-card-header">
            <div>
              <div class="verif-name">${escapeHtml(v.userName || 'بدون اسم')} <span class="verif-role ${roleClass}">${roleLabel}</span></div>
              <div style="font-size:11.5px; color:var(--muted); margin-top:4px;">${created}</div>
            </div>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="verif-type-badge ${typeClass}">${typeLabel}</span>
              ${statusBadge}
            </div>
          </div>
          <div class="verif-details">${planInfo}</div>
          ${notesHtml}
          ${actions}
        </div>
      `;
    }).join('');
  }

  container.innerHTML = `
    <div class="filter-bar">${filtersHtml}</div>
    ${listHtml}
  `;
}

window.setVerifFilter = function(f) {
  verificationFilter = f;
  renderVerification();
};

window.approveVerification = async function(reqId, uid) {
  if (!confirm('تأكيد الموافقة على التوثيق؟')) return;
  try {
    const req = allVerifications.find(v => v.id === reqId);
    if (!req) throw new Error('الطلب غير موجود');

    const durationDays = req.type === 'free' ? 0 : (req.durationDays || 30);
    await activateVerification(uid, durationDays);
    await updateDoc(doc(db, 'verification_requests', reqId), {
      status: 'approved',
      reviewedAt: serverTimestamp()
    });
    await createNotification(
      uid, 'verification_approved', '✅ تم توثيق حسابك',
      req.type === 'free'
        ? 'تم توثيق حسابك مجاناً — بدون تاريخ انتهاء'
        : `تم توثيق حسابك لمدة ${durationDays} يوم`,
      'profile.html'
    );
    showToast('تم التوثيق بنجاح');
    loadAllData();
  } catch (e) { console.error(e); showToast(e.message || 'حدث خطأ', 'error'); }
};

window.rejectVerificationPrompt = async function(reqId, uid) {
  const reason = prompt('سبب الرفض (سيظهر للمستخدم):', 'لم يتم التحقق من الهوية');
  if (reason === null) return;
  try {
    await rejectVerification(reqId, uid, reason);
    showToast('تم الرفض');
    loadAllData();
  } catch (e) { console.error(e); showToast('حدث خطأ', 'error'); }
};

/* ===== Content Tree (existing) ===== */
function renderTree() {
  const container = document.getElementById("treeContainer");
  const rootNodes = treeData.filter(n => n.parentId === "root");
  if (rootNodes.length === 0) { container.innerHTML = `<p style="text-align:center; padding:30px; color:var(--muted)">لا يوجد محتوى.</p>`; return; }
  container.innerHTML = buildHTML(rootNodes);
}

function buildHTML(nodes) {
  return nodes.map(node => {
    const children = treeData.filter(n => n.parentId === node.id);
    const isModule = node.type.startsWith('module_');
    const isOpen = openNodes.has(node.id);
    let actionsHtml = isModule
      ? `<button class="action-btn" onclick="editModule('${node.id}')"><i class="fas fa-edit"></i></button><button class="action-btn danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>`
      : `<button class="action-btn" onclick="editNode('${node.id}')"><i class="fas fa-edit"></i></button><button class="action-btn manage" onclick="openManage('${node.id}', '${escapeHtml(node.title)}')"><i class="fas fa-cog"></i></button><button class="action-btn" onclick="openAddModal('${node.id}', '${node.type}')"><i class="fas fa-plus"></i></button><button class="action-btn danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>`;
    return `<div class="tree-group"><div class="node-card"><div class="node-header"><div class="node-title-area" onclick="toggleChildren('${node.id}')"><div class="node-icon"><i class="fas ${isModule ? (node.type === 'module_video' ? 'fa-video' : 'fa-file') : 'fa-folder'}"></i></div><div class="node-text"><div class="node-title">${escapeHtml(node.title)}</div><div class="node-type">${node.type}</div></div></div><div class="node-actions">${actionsHtml}</div></div>${!isModule ? `<div class="children-area ${isOpen ? 'active' : ''}" id="children-${node.id}">${children.length > 0 ? buildHTML(children) : '<div style="text-align:center; color:#aaa; font-size:12px; padding:5px;">لا يوجد فروع</div>'}</div>` : ''}</div></div>`;
  }).join('');
}

window.toggleChildren = function(id) {
  const el = document.getElementById(`children-${id}`);
  if (el) {
    el.classList.toggle('active');
    if (el.classList.contains('active')) openNodes.add(id);
    else openNodes.delete(id);
  }
};

window.openAddModal = function(parentId, parentType) {
  let newType = parentType === 'root' ? 'year' : parentType === 'year' ? 'program' : parentType === 'program' ? 'subject' : 'custom';
  document.getElementById("modalTitle").textContent = "إضافة جديد";
  document.getElementById("nodeParentId").value = parentId || "root";
  document.getElementById("nodeType").value = newType;
  document.getElementById("nodeTitle").value = "";
  document.getElementById("nodeModal").dataset.editId = "";
  document.getElementById("nodeModal").classList.add("active");
};

window.editNode = function(id) {
  const node = treeData.find(n => n.id === id);
  if (!node) return;
  document.getElementById("modalTitle").textContent = "تعديل";
  document.getElementById("nodeParentId").value = node.parentId;
  document.getElementById("nodeType").value = node.type;
  document.getElementById("nodeTitle").value = node.title;
  document.getElementById("nodeModal").dataset.editId = id;
  document.getElementById("nodeModal").classList.add("active");
};

window.saveNode = async function() {
  const parentId = document.getElementById("nodeParentId").value;
  const type = document.getElementById("nodeType").value;
  const title = document.getElementById("nodeTitle").value.trim();
  const editId = document.getElementById("nodeModal").dataset.editId;
  if (!title) return;
  try {
    if (editId) await updateDoc(doc(db, "content_tree", editId), { title });
    else await addDoc(collection(db, "content_tree"), { parentId, type, title, createdAt: serverTimestamp() });
    closeModal('nodeModal');
    loadAllData();
  } catch (e) { showToast("حدث خطأ", "error"); }
};

window.openManage = function(nodeId, nodeTitle) {
  document.getElementById("manageTitle").textContent = `إدارة: ${nodeTitle}`;
  document.getElementById("manageModal").dataset.currentNodeId = nodeId;
  document.getElementById("manageModal").classList.add("active");
};

window.handleHtmlFileUpload = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!/\.(html?|htm)$/i.test(file.name)) { showToast('يرجى اختيار ملف HTML صالح (.html أو .htm)', 'error'); event.target.value = ''; return; }
  if (file.size > 1024 * 1024) { showToast('حجم الملف كبير جداً (الحد الأقصى 1 ميجابايت)', 'error'); event.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    document.getElementById('moduleCode').value = content;
    const zone = document.getElementById('htmlUploadZone');
    zone.classList.add('success');
    zone.querySelector('.up-text').textContent = '✓ تم تحميل الملف بنجاح';
    zone.querySelector('.up-sub').textContent = 'يمكنك تعديل الكود أدناه أو الحفظ مباشرة';
    zone.querySelector('i').className = 'fas fa-check-circle';
    const info = document.getElementById('htmlFileInfo');
    const sizeKB = (file.size / 1024).toFixed(1);
    info.textContent = `📄 ${file.name} — ${sizeKB} KB — ${content.split('\n').length} سطر`;
    info.classList.add('show');
    showToast('تم تحميل محتوى الملف، راجع الكود ثم اضغط حفظ');
  };
  reader.onerror = function() { showToast('حدث خطأ في قراءة الملف', 'error'); };
  reader.readAsText(file);
};

window.openVideoManager = function() {
  const nodeId = document.getElementById('manageModal').dataset.currentNodeId;
  const existing = treeData.find(n => n.parentId === nodeId && n.type === 'module_video');
  document.getElementById('videoModal').dataset.nodeId = nodeId;
  document.getElementById('videoModal').dataset.editId = existing ? existing.id : '';
  document.getElementById('videoSectionTitle').value = existing ? existing.title : 'فيديوهات';
  document.getElementById('videoAccessInput').value = existing ? (existing.access || 'paid') : 'paid';
  const container = document.getElementById('videoItemsContainer');
  container.innerHTML = '';
  videoItemCounter = 0;
  const videos = (existing && existing.videos) ? existing.videos : [];
  if (videos.length > 0) videos.forEach(v => addVideoItemWithData(v));
  else addVideoItem();
  closeModal('manageModal');
  document.getElementById('videoModal').classList.add('active');
};

function addVideoItem() { addVideoItemWithData(null); }

function addVideoItemWithData(v) {
  const index = videoItemCounter++;
  const container = document.getElementById('videoItemsContainer');
  const sourceType = v && v.sourceType ? v.sourceType : 'link';
  const html = `
    <div class="video-item" data-index="${index}">
      <div class="video-item-header">
        <strong style="color:var(--navy);font-size:14px;">فيديو</strong>
        <button class="action-btn danger" onclick="removeVideoItem(this)"><i class="fas fa-trash"></i></button>
      </div>
      <div class="form-group"><label>عنوان الفيديو</label><input type="text" class="video-title-input" value="${v ? escapeHtml(v.title || '') : ''}" placeholder="اسم الفيديو"></div>
      <div class="form-group"><label>نوع المصدر</label><select class="video-source-type" onchange="toggleVideoSource(this)"><option value="link" ${sourceType === 'link' ? 'selected' : ''}>رابط فيديو (يوتيوب / مباشر)</option><option value="upload" ${sourceType === 'upload' ? 'selected' : ''}>رفع ملف</option></select></div>
      <div class="form-group video-link-group" style="display:${sourceType === 'upload' ? 'none' : 'block'};"><label>الرابط</label><input type="text" class="video-url-input" value="${v && v.url ? escapeHtml(v.url) : ''}" placeholder="https://youtube.com/... أو https://example.com/video.mp4" dir="ltr"></div>
      <div class="form-group video-upload-group" style="display:${sourceType === 'upload' ? 'block' : 'none'};"><label>رفع ملف فيديو</label><input type="file" accept="video/*" class="video-file-input" onchange="handleVideoFileSelect(this)"><div class="video-file-preview" style="display:${v && v.fileName ? 'block' : 'none'};">${v && v.fileName ? `<i class="fas fa-file-video" style="color:var(--red);"></i> ${escapeHtml(v.fileName)}` : ''}</div><small style="display:block;margin-top:6px;color:var(--muted);font-size:12px;">⚠️ رفع الفيديوهات وتخزينها قيد التطوير. حالياً يمكنك معاينة الملف فقط.</small></div>
      <div class="form-group"><label>ملاحظات تحت الفيديو</label><textarea class="video-notes-input" rows="2" placeholder="ملاحظات أو شرح مختصر...">${v && v.notes ? escapeHtml(v.notes) : ''}</textarea></div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', html);
  updateVideoLabels();
}

function updateVideoLabels() {
  document.querySelectorAll('#videoItemsContainer .video-item').forEach((item, i) => {
    const header = item.querySelector('.video-item-header strong');
    if (header) header.textContent = `فيديو ${i + 1}`;
  });
}

window.removeVideoItem = function(btn) { btn.closest('.video-item').remove(); updateVideoLabels(); };

window.toggleVideoSource = function(select) {
  const item = select.closest('.video-item');
  const linkGroup = item.querySelector('.video-link-group');
  const uploadGroup = item.querySelector('.video-upload-group');
  if (select.value === 'link') { linkGroup.style.display = 'block'; uploadGroup.style.display = 'none'; }
  else { linkGroup.style.display = 'none'; uploadGroup.style.display = 'block'; }
};

window.handleVideoFileSelect = function(input) {
  const file = input.files[0];
  if (!file) return;
  const preview = input.parentElement.querySelector('.video-file-preview');
  const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
  preview.style.display = 'block';
  preview.innerHTML = `<i class="fas fa-file-video" style="color:var(--red);"></i> ${escapeHtml(file.name)} <span style="color:var(--muted);">(${sizeMB} MB)</span>`;
};

window.saveVideos = async function() {
  const nodeId = document.getElementById('videoModal').dataset.nodeId;
  const editId = document.getElementById('videoModal').dataset.editId;
  const title = document.getElementById('videoSectionTitle').value.trim();
  const access = document.getElementById('videoAccessInput').value;
  if (!title) { showToast('أدخل عنوان القسم', 'error'); return; }

  const videos = [];
  document.querySelectorAll('#videoItemsContainer .video-item').forEach((item, i) => {
    const vTitle = item.querySelector('.video-title-input').value.trim();
    const sourceType = item.querySelector('.video-source-type').value;
    const url = item.querySelector('.video-url-input').value.trim();
    const notes = item.querySelector('.video-notes-input').value.trim();
    const preview = item.querySelector('.video-file-preview');
    const fileName = preview && preview.style.display !== 'none' ? preview.textContent.trim() : '';
    if (!vTitle) return;
    videos.push({ title: vTitle, sourceType, url: sourceType === 'link' ? url : null, fileName: sourceType === 'upload' ? fileName : null, notes, order: i + 1 });
  });

  if (videos.length === 0) { showToast('أضف فيديو واحد على الأقل', 'error'); return; }

  try {
    if (editId) await updateDoc(doc(db, 'content_tree', editId), { title, access, videos, updatedAt: serverTimestamp() });
    else await addDoc(collection(db, 'content_tree'), { parentId: nodeId, type: 'module_video', title, access, videos, createdAt: serverTimestamp() });
    openNodes.add(nodeId);
    showToast('تم حفظ الفيديوهات بنجاح');
    closeModal('videoModal');
    loadAllData();
  } catch (e) { showToast('خطأ: ' + e.message, 'error'); }
};

window.openCodeEditor = function(moduleKey, moduleTitle) {
  const nodeId = document.getElementById("manageModal").dataset.currentNodeId;
  document.getElementById("codeTitle").textContent = `إعداد ${moduleTitle}`;
  document.getElementById("currentNodeId").value = nodeId;
  document.getElementById("currentModuleKey").value = moduleKey;
  const existing = treeData.find(n => n.parentId === nodeId && n.type === 'module_' + moduleKey);
  document.getElementById("moduleTitleInput").value = existing ? existing.title : moduleTitle;
  document.getElementById("moduleAccessInput").value = existing ? (existing.access || 'public') : 'public';
  document.getElementById("moduleCode").value = existing ? (existing.htmlContent || '') : '';
  resetHtmlUploadZone();
  closeModal('manageModal');
  document.getElementById("codeModal").classList.add("active");
};

function resetHtmlUploadZone() {
  const zone = document.getElementById('htmlUploadZone');
  zone.classList.remove('success');
  zone.querySelector('.up-text').textContent = 'اضغط لاختيار ملف HTML';
  zone.querySelector('.up-sub').textContent = '.html أو .htm — سيتم قراءة المحتوى تلقائياً';
  zone.querySelector('i').className = 'fas fa-cloud-upload-alt';
  document.getElementById('htmlFileInput').value = '';
  document.getElementById('htmlFileInfo').classList.remove('show');
}

window.saveModuleCode = async function() {
  const nodeId = document.getElementById("currentNodeId").value;
  const moduleKey = document.getElementById("currentModuleKey").value;
  const title = document.getElementById("moduleTitleInput").value.trim();
  const access = document.getElementById("moduleAccessInput").value;
  const code = document.getElementById("moduleCode").value;
  const existing = treeData.find(n => n.parentId === nodeId && n.type === 'module_' + moduleKey);

  if (!code || !code.trim()) { showToast('أدخل الكود أو ارفع ملف HTML أولاً', 'error'); return; }

  try {
    if (existing) await updateDoc(doc(db, "content_tree", existing.id), { title, access, htmlContent: code });
    else await addDoc(collection(db, "content_tree"), { parentId: nodeId, type: 'module_' + moduleKey, title, access, htmlContent: code, createdAt: serverTimestamp() });
    openNodes.add(nodeId);
    closeModal('codeModal');
    loadAllData();
    showToast('تم الحفظ بنجاح');
  } catch (e) { showToast('خطأ في الحفظ', 'error'); }
};

window.editModule = async function(nodeId) {
  const node = treeData.find(n => n.id === nodeId);
  if (!node) return;
  if (node.type === 'module_video') {
    document.getElementById('videoModal').dataset.nodeId = node.parentId;
    document.getElementById('videoModal').dataset.editId = node.id;
    document.getElementById('videoSectionTitle').value = node.title;
    document.getElementById('videoAccessInput').value = node.access || 'paid';
    const container = document.getElementById('videoItemsContainer');
    container.innerHTML = '';
    videoItemCounter = 0;
    const videos = node.videos || [];
    if (videos.length > 0) videos.forEach(v => addVideoItemWithData(v));
    else addVideoItem();
    document.getElementById('videoModal').classList.add('active');
  } else {
    document.getElementById("currentNodeId").value = node.parentId;
    document.getElementById("currentModuleKey").value = node.type.replace('module_', '');
    document.getElementById("moduleTitleInput").value = node.title;
    document.getElementById("moduleAccessInput").value = node.access || 'public';
    document.getElementById("moduleCode").value = node.htmlContent || '';
    resetHtmlUploadZone();
    document.getElementById("codeModal").classList.add("active");
  }
};

window.deleteNode = async function(id) {
  if (treeData.some(n => n.parentId === id)) { showToast('احذف المحتوى الداخلي أولاً', 'error'); return; }
  if (!confirm("حذف؟")) return;
  await deleteDoc(doc(db, "content_tree", id));
  loadAllData();
};
window.closeModal = function(id) { document.getElementById(id).classList.remove("active"); };

/* ===== Admin Notifications ===== */
function updateAdminBadge() {
  const unread = adminNotifs.filter(n => !n.read).length;
  const badge = document.getElementById('adminNotifBadge');
  if (badge) {
    badge.style.display = unread > 0 ? 'flex' : 'none';
    badge.textContent = unread > 9 ? '9+' : unread;
  }
}

function renderAdminNotifsPanel() {
  const body = document.getElementById('adminNotifBody');
  if (!body) return;
  if (adminNotifs.length === 0) {
    body.innerHTML = `<p style="text-align:center; color:var(--muted); padding:40px;">لا توجد إشعارات</p>`;
    return;
  }
  body.innerHTML = adminNotifs.map(n => {
    let time = '';
    try { time = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleString('ar-EG') : ''; } catch (e) { }
    return `<div class="admin-notif-item ${n.read ? '' : 'unread'}" onclick="handleAdminNotif('${n.id}')">
      <div class="n-title">${escapeHtml(n.title || '')}</div>
      <div class="n-msg">${escapeHtml(n.message || '')}</div>
      <div class="n-time">${time}</div>
    </div>`;
  }).join('');
}

window.openAdminNotifications = function() {
  document.getElementById('adminNotifPanel').classList.add('active');
  document.getElementById('adminNotifOverlay').classList.add('active');
};

window.closeAdminNotifications = function() {
  document.getElementById('adminNotifPanel').classList.remove('active');
  document.getElementById('adminNotifOverlay').classList.remove('active');
};

window.handleAdminNotif = async function(notifId) {
  await markAdminNotificationRead(notifId);
  closeAdminNotifications();
};

window.markAllAdminRead = async function() {
  await markAllAdminNotificationsRead(adminNotifs);
  showToast('تم تعليم الكل كمقروء');
};
</script>
</body>
</html>
