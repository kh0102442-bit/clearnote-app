<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ClearNote — لوحة التحكم</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --navy: #152741; --accent: #a8741a; --bg: #f4f6f8;
    --white: #ffffff; --text: #1a1a1a; --muted: #5b6472; --line: #e9ecef;
  }
  html, body {
    max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0;
    background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; padding-bottom: 30px; font-size: 16px;
  }

  /* شريط التنقل العلوي */
  .admin-header {
    background: var(--navy); color: white; padding: 15px 18px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .admin-brand { font-family: Georgia, serif; font-size: 22px; font-weight: bold; }
  .admin-brand span { color: var(--accent); }
  
  /* أزرار التنقل */
  .admin-nav { display: flex; gap: 10px; margin-bottom: 20px; padding: 0 15px; }
  .nav-tab { flex: 1; background: var(--white); border: 2px solid var(--line); padding: 12px; border-radius: 12px; font-size: 16px; font-weight: bold; color: var(--muted); cursor: pointer; text-align: center; transition: 0.2s; }
  .nav-tab.active { background: var(--navy); color: white; border-color: var(--navy); }

  /* الأزرار الأساسية */
  .btn-add-main { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-logout { background: rgba(255,255,255,0.1); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

  .admin-container { padding: 0 15px; width: 100%; box-sizing: border-box; }

  /* ===== شجرة المحتوى ===== */
  .tree-group { margin-bottom: 15px; width: 100%; box-sizing: border-box; }
  .node-card {
    background: var(--white); border: 2px solid var(--line); border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.03); width: 100%; box-sizing: border-box; overflow: hidden;
  }
  .node-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: var(--white); }
  .node-title-area { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .node-icon { width: 45px; height: 45px; border-radius: 12px; background: #eef2fa; color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .node-text { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 4px; }
  .node-title { font-weight: 800; color: var(--navy); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-type { font-size: 12px; color: var(--accent); font-weight: 700; }

  .node-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .action-btn { width: 38px; height: 38px; border-radius: 8px; border: 2px solid var(--line); background: #f8f9fa; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; cursor: pointer; }
  .action-btn.manage { color: #1f6b45; border-color: #c9d6ee; background: #eef2fa; }
  .action-btn.danger { color: #b91c1c; background: #fbeaea; border-color: #fbeaea; }

  .children-area { display: none; padding: 12px; background: #fafbfc; border-top: 2px solid var(--line); }
  .children-area.active { display: block; }
  
  .node-card[data-type="module_explain"] .node-icon { background: #e8f5e9; color: #27ae60; }
  .node-card[data-type="module_video"] .node-icon { background: #ffebee; color: #e74c3c; }
  .node-card[data-type="module_questions"] .node-icon { background: #e3f2fd; color: #3498db; }
  .node-card[data-type="module_summary"] .node-icon { background: #f3e5f5; color: #9b59b6; }
  .node-card[data-type="module_terms"] .node-icon { background: #fff3e0; color: #e67e22; }

  /* ===== كروت الطلاب ===== */
  .student-card {
    background: var(--white); border: 2px solid var(--line); border-radius: 16px;
    padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .student-info { display: flex; flex-direction: column; gap: 4px; }
  .student-name { font-weight: bold; color: var(--navy); font-size: 17px; }
  .student-email { font-size: 13px; color: var(--muted); }
  .student-role { font-size: 12px; background: #f4f6f8; padding: 2px 8px; border-radius: 10px; width: max-content; font-weight: bold; color: var(--accent); }
  
  /* المودال */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; z-index: 1000; }
  .modal-overlay.active { display: flex; }
  .modal-box { background: var(--white); border-radius: 24px 24px 0 0; width: 100%; padding: 25px 20px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-box h3 { margin: 0 0 12px; color: var(--navy); font-size: 20px; text-align: center; }
  .modal-box p { margin: 0 0 20px; color: var(--muted); font-size: 15px; text-align: center; }
  
  .form-group { margin-bottom: 18px; width: 100%; }
  .form-group label { display: block; font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: 16px; box-sizing: border-box; background: #fafbfc;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--navy); }
  
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .btn-save { flex: 1; background: var(--navy); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
  .btn-cancel { flex: 1; background: #e9ecef; color: var(--muted); border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }

  .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .module-item { background: #f8f9fa; border: 2px solid var(--line); border-radius: 14px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
  .module-item:active { background: #eef2fa; border-color: var(--navy); }
  .module-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
  .module-title { font-size: 16px; font-weight: 800; color: var(--navy); }
  
  .icon-explain { background: #27ae60; }
  .icon-video { background: #e74c3c; }
  .icon-questions { background: #3498db; }
  .icon-summary { background: #9b59b6; }
  .icon-terms { background: #e67e22; }
    body { font-family: 'Cairo', system-ui, sans-serif; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="admin-header">
  <div class="admin-brand">CLEAR<span>NOTE</span></div>
  <div style="display:flex; gap:12px;">
    <button class="btn-add-main" id="addBtn" onclick="openAddModal(null, 'root')"><i class="fas fa-plus"></i> سنة</button>
    <button class="btn-logout" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i></button>
  </div>
</div>

<div class="admin-nav">
  <div class="nav-tab active" onclick="switchTab('tree')">شجرة المحتوى</div>
  <div class="nav-tab" onclick="switchTab('students')">الطلاب</div>
</div>

<div class="admin-container">
  <!-- شجرة المحتوى -->
  <div id="treeContainer">
    <p style="text-align:center; color:var(--muted); padding: 20px; font-size:16px;">جاري التحميل...</p>
  </div>

  <!-- قائمة الطلاب -->
  <div id="studentsContainer" style="display:none;">
    <p style="text-align:center; color:var(--muted); padding: 20px; font-size:16px;">جاري تحميل الطلاب...</p>
  </div>
</div>

<!-- مودال الإضافة -->
<div class="modal-overlay" id="nodeModal">
  <div class="modal-box">
    <h3 id="modalTitle">إضافة</h3>
    <p id="modalDesc"></p>
    <input type="hidden" id="nodeParentId">
    <input type="hidden" id="nodeType">
    <div class="form-group" id="titleGroup">
      <label>العنوان</label>
      <input type="text" id="nodeTitle" placeholder="اكتب هنا...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('nodeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveNode()">حفظ</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="manageModal">
  <div class="modal-box">
    <h3 id="manageTitle">إدارة محتوى</h3>
    <p>اختر الجزء لإضافة الكود الخاص به:</p>
    <div class="modules-grid">
      <div class="module-item" onclick="openCodeEditor('explain', 'الشرح')"><div class="module-icon icon-explain"><i class="fas fa-file-alt"></i></div><div class="module-title">الشرح</div></div>
      <div class="module-item" onclick="openCodeEditor('video', 'فيديو')"><div class="module-icon icon-video"><i class="fas fa-video"></i></div><div class="module-title">فيديو</div></div>
      <div class="module-item" onclick="openCodeEditor('questions', 'أسئلة')"><div class="module-icon icon-questions"><i class="fas fa-question-circle"></i></div><div class="module-title">أسئلة</div></div>
      <div class="module-item" onclick="openCodeEditor('summary', 'ملخص')"><div class="module-icon icon-summary"><i class="fas fa-clipboard-list"></i></div><div class="module-title">ملخص</div></div>
      <div class="module-item" onclick="openCodeEditor('terms', 'مصطلحات')"><div class="module-icon icon-terms"><i class="fas fa-book"></i></div><div class="module-title">مصطلحات</div></div>
    </div>
    <button class="btn-cancel" style="width:100%;" onclick="closeModal('manageModal')">إغلاق</button>
  </div>
</div>

<div class="modal-overlay" id="codeModal">
  <div class="modal-box">
    <h3 id="codeTitle">إضافة كود</h3>
    <input type="hidden" id="currentNodeId">
    <input type="hidden" id="currentModuleKey">
    <div class="form-group"><label>عنوان المحتوى</label><input type="text" id="moduleTitleInput"></div>
    <div class="form-group"><label>وصف المحتوى</label><input type="text" id="moduleDescInput"></div>
    <div class="form-group"><label>المصادر (اختياري)</label><input type="text" id="moduleSourcesInput"></div>
    <div class="form-group"><label>صلاحية الوصول</label><select id="moduleAccessInput"><option value="public">عام</option><option value="paid">مدفوع</option></select></div>
    <div class="form-group"><label>كود HTML</label><textarea id="moduleCode" rows="6" style="font-family: monospace;"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('codeModal')">إلغاء</button>
      <button class="btn-save" onclick="saveModuleCode()">حفظ</button>
    </div>
  </div>
</div>

<script type="module">
import { db, onAuth, isAdmin, goTo, showToast, signOutUser } from "./shared.js";
import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let treeData = [];
let allStudents = [];
let currentTab = 'tree';

const NODE_TYPES = { year: { label: 'سنة دراسية', icon: 'fa-calendar-alt' }, program: { label: 'برنامج', icon: 'fa-graduation-cap' }, subject: { label: 'مادة', icon: 'fa-book' }, custom: { label: 'تبويب', icon: 'fa-folder' }, module_explain: { label: 'شرح', icon: 'fa-file-alt' }, module_video: { label: 'فيديو', icon: 'fa-video' }, module_questions: { label: 'أسئلة', icon: 'fa-question-circle' }, module_summary: { label: 'ملخص', icon: 'fa-clipboard-list' }, module_terms: { label: 'مصطلحات', icon: 'fa-book' } };

onAuth((user, userData) => { 
  if (!user || !isAdmin(userData)) { goTo("index.html"); return; } 
  loadTree(); 
  loadStudents();
});

window.doLogout = async () => { await signOutUser(); goTo("index.html"); };

// ===== التنقل بين التبويبات =====
window.switchTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => {
    if(t.innerText.includes(tab === 'tree' ? 'شجرة' : 'الطلاب')) t.classList.add('active');
  });
  
  if(tab === 'tree') {
    document.getElementById('treeContainer').style.display = 'block';
    document.getElementById('studentsContainer').style.display = 'none';
    document.getElementById('addBtn').style.display = 'flex';
  } else {
    document.getElementById('treeContainer').style.display = 'none';
    document.getElementById('studentsContainer').style.display = 'block';
    document.getElementById('addBtn').style.display = 'none';
  }
};

// ===== تحميل الطلاب =====
async function loadStudents() {
  try {
    const snap = await getDocs(collection(db, "users"));
    allStudents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStudents();
  } catch (e) {
    document.getElementById("studentsContainer").innerHTML = `<p style="color:red;">خطأ في تحميل الطلاب: ${e.message}</p>`;
  }
}

function renderStudents() {
  const container = document.getElementById('studentsContainer');
  if(allStudents.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--muted); padding: 20px; font-size:16px;">لا يوجد طلاب مسجلون حتى الآن.</p>`;
    return;
  }
  
  let html = '';
  allStudents.forEach(student => {
    let roleText = student.role === 'admin' ? 'أدمن' : (student.role === 'ta' ? 'معيد' : (student.role === 'doctor' ? 'دكتور' : 'طالب'));
    let roleColor = student.role === 'admin' ? '#b91c1c' : (student.role === 'ta' ? '#3498db' : (student.role === 'doctor' ? '#27ae60' : 'var(--accent)'));
    
    html += `
      <div class="student-card">
        <div class="student-info">
          <div class="student-name">${student.name || 'بدون اسم'}</div>
          <div class="student-email">${student.email || ''}</div>
          <div class="student-role" style="color:${roleColor};">${roleText}</div>
        </div>
        <div>
          <button class="action-btn" onclick="alert('قريباً: تفاصيل الطالب')" style="background:#eef2fa; color:#1f6b45;"><i class="fas fa-eye"></i></button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// ===== شجرة المحتوى (نفس الكود القديم) =====
async function loadTree() {
  try {
    const snap = await getDocs(collection(db, "content_tree"));
    treeData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTree();
  } catch (e) { document.getElementById("treeContainer").innerHTML = `<p style="color:red;">خطأ: ${e.message}</p>`; }
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  const rootNodes = treeData.filter(n => n.parentId === "root");
  if (rootNodes.length === 0) { container.innerHTML = `<p style="text-align:center; color:var(--muted); padding: 20px; font-size:16px;">لا يوجد محتوى.</p>`; return; }
  container.innerHTML = buildHTML(rootNodes);
}

function buildHTML(nodes) {
  let html = "";
  nodes.sort((a, b) => { if (a.type.startsWith('module_') && !b.type.startsWith('module_')) return -1; if (!a.type.startsWith('module_') && b.type.startsWith('module_')) return 1; return 0; });
  nodes.forEach(node => {
    const children = treeData.filter(n => n.parentId === node.id);
    const typeInfo = NODE_TYPES[node.type] || NODE_TYPES.custom;
    const isModule = node.type.startsWith('module_');
    let actionsHtml = isModule ? `<button class="action-btn" onclick="editModule('${node.id}')"><i class="fas fa-edit"></i></button><button class="action-btn danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>` : `<button class="action-btn manage" onclick="openManage('${node.id}', '${node.title}')"><i class="fas fa-cog"></i></button><button class="action-btn" onclick="openAddModal('${node.id}', '${node.type}')"><i class="fas fa-plus"></i></button><button class="action-btn danger" onclick="deleteNode('${node.id}')"><i class="fas fa-trash"></i></button>`;
    let extraInfo = isModule && node.description ? `<div style="font-size:13px; color:var(--muted); margin-top:4px;">${node.description}</div>` : "";
    html += `<div class="tree-group"><div class="node-card" data-type="${node.type}"><div class="node-header"><div class="node-title-area" onclick="toggleChildren('${node.id}')"><div class="node-icon"><i class="fas ${typeInfo.icon}"></i></div><div class="node-text"><div class="node-title">${node.title}</div><div class="node-type">${typeInfo.label}</div>${extraInfo}</div></div><div class="node-actions">${actionsHtml}</div></div>${!isModule ? `<div class="children-area" id="children-${node.id}">${children.length > 0 ? buildHTML(children) : '<div style="text-align:center; color:#aaa; font-size:14px; padding:10px;">لا يوجد فروع</div>'}</div>` : ''}</div></div>`;
  });
  return html;
}

window.toggleChildren = function(id) { const el = document.getElementById(`children-${id}`); if (el) el.classList.toggle('active'); };

window.openAddModal = function(parentId, parentType) {
  let newType = "custom"; let title = "إضافة تبويب"; let desc = "";
  if (parentType === 'root') { newType = 'year'; title = "إضافة سنة"; desc = "مثل: الفرقة الأولى"; }
  else if (parentType === 'year') { newType = 'program'; title = "إضافة برنامج"; desc = "مثل: برنامج عام"; }
  else if (parentType === 'program') { newType = 'subject'; title = "إضافة مادة"; desc = "مثل: Anatomy"; }
  document.getElementById("modalTitle").textContent = title; document.getElementById("modalDesc").textContent = desc; document.getElementById("nodeParentId").value = parentId || "root"; document.getElementById("nodeType").value = newType; document.getElementById("nodeTitle").value = ""; document.getElementById("nodeModal").classList.add("active");
};

window.saveNode = async function() {
  const parentId = document.getElementById("nodeParentId").value; const type = document.getElementById("nodeType").value; const title = document.getElementById("nodeTitle").value.trim();
  if (!title) { showToast("أدخل العنوان", "error"); return; }
  try { await addDoc(collection(db, "content_tree"), { parentId, type, title, updatedAt: serverTimestamp(), createdAt: serverTimestamp() }); showToast("تمت الإضافة"); closeModal('nodeModal'); loadTree(); } catch (e) { showToast("خطأ", "error"); }
};

window.openManage = function(nodeId, nodeTitle) { document.getElementById("manageTitle").textContent = `إدارة: ${nodeTitle}`; document.getElementById("manageModal").dataset.currentNodeId = nodeId; document.getElementById("manageModal").classList.add("active"); };

window.openCodeEditor = function(moduleKey, moduleTitle) {
  const nodeId = document.getElementById("manageModal").dataset.currentNodeId; document.getElementById("codeTitle").textContent = `إعداد ${moduleTitle}`; document.getElementById("currentNodeId").value = nodeId; document.getElementById("currentModuleKey").value = moduleKey;
  const existing = treeData.find(n => n.parentId === nodeId && n.type === 'module_' + moduleKey);
  document.getElementById("moduleTitleInput").value = existing ? existing.title : moduleTitle; document.getElementById("moduleDescInput").value = existing ? (existing.description || '') : ''; document.getElementById("moduleSourcesInput").value = existing ? (existing.sources || '') : ''; document.getElementById("moduleAccessInput").value = existing ? (existing.access || 'public') : 'public'; document.getElementById("moduleCode").value = existing ? (existing.htmlContent || '') : '';
  closeModal('manageModal'); document.getElementById("codeModal").classList.add("active");
};

window.saveModuleCode = async function() {
  const nodeId = document.getElementById("currentNodeId").value; const moduleKey = document.getElementById("currentModuleKey").value; const title = document.getElementById("moduleTitleInput").value.trim(); const description = document.getElementById("moduleDescInput").value.trim(); const sources = document.getElementById("moduleSourcesInput").value.trim(); const access = document.getElementById("moduleAccessInput").value; const code = document.getElementById("moduleCode").value;
  if (!title) { showToast("أدخل العنوان", "error"); return; }
  try {
    const existing = treeData.find(n => n.parentId === nodeId && n.type === 'module_' + moduleKey);
    const data = { title, description, sources, access, htmlContent: code, updatedAt: serverTimestamp() };
    if (existing) { await updateDoc(doc(db, "content_tree", existing.id), data); } else { data.parentId = nodeId; data.type = 'module_' + moduleKey; data.createdAt = serverTimestamp(); await addDoc(collection(db, "content_tree"), data); }
    showToast("تم الحفظ"); closeModal('codeModal'); setTimeout(() => { const el = document.getElementById(`children-${nodeId}`); if (el) el.classList.add('active'); }, 500); loadTree();
  } catch (e) { showToast("خطأ", "error"); }
};

window.editModule = async function(nodeId) {
  const node = treeData.find(n => n.id === nodeId); if (!node) return;
  document.getElementById("codeTitle").textContent = `تعديل ${node.title}`; document.getElementById("currentNodeId").value = node.parentId; document.getElementById("currentModuleKey").value = node.type.replace('module_', ''); document.getElementById("moduleTitleInput").value = node.title || ''; document.getElementById("moduleDescInput").value = node.description || ''; document.getElementById("moduleSourcesInput").value = node.sources || ''; document.getElementById("moduleAccessInput").value = node.access || 'public'; document.getElementById("moduleCode").value = node.htmlContent || ''; document.getElementById("codeModal").classList.add("active");
};

window.deleteNode = async function(id) {
  if (treeData.some(n => n.parentId === id)) { showToast("احذف الفروع أولاً!", "error"); return; }
  if (!confirm("هل أنت متأكد من الحذف؟")) return;
  try { await deleteDoc(doc(db, "content_tree", id)); showToast("تم الحذف"); loadTree(); } catch (e) { showToast("خطأ", "error"); }
};

window.closeModal = function(id) { document.getElementById(id).classList.remove("active"); };
</script>
</body>
</html>
